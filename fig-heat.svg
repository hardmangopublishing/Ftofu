<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" role="img" aria-label="Three heat methods for crisping tofu compared"><title>Three heat methods for crisping tofu compared</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E85D04"/></marker></defs><rect x="40" y="30" width="140" height="100" fill="#fff" stroke="#16120D" stroke-width="2"/><text x="110" y="52" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="12" letter-spacing="0.6" fill="#16120D" text-anchor="middle" font-weight="600">PAN</text><text x="110" y="68" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="9" letter-spacing="0.6" fill="#8A8078" text-anchor="middle" font-weight="400">CONTACT</text><line x1="70" y1="112" x2="150" y2="112" stroke="#E85D04" stroke-width="4"/><rect x="92" y="92" width="36" height="20" fill="#F2F0EB" stroke="#16120D" stroke-width="1.6"/><text x="40" y="150" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="11" letter-spacing="0.6" fill="#E85D04" text-anchor="start" font-weight="600">MED-HIGH</text><text x="40" y="166" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="11" letter-spacing="0.6" fill="#16120D" text-anchor="start" font-weight="400">8-12 MIN</text><text x="40" y="182" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="10" letter-spacing="0.6" fill="#8A8078" text-anchor="start" font-weight="400">DEEPEST CRUST</text><rect x="210" y="30" width="140" height="100" fill="#fff" stroke="#16120D" stroke-width="2"/><text x="280" y="52" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="12" letter-spacing="0.6" fill="#16120D" text-anchor="middle" font-weight="600">AIR FRYER</text><text x="280" y="68" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="9" letter-spacing="0.6" fill="#8A8078" text-anchor="middle" font-weight="400">MOVING AIR</text><circle cx="280" cy="100" r="26" fill="none" stroke="#E85D04" stroke-width="2" stroke-dasharray="6 5"/><rect x="268" y="92" width="24" height="16" fill="#F2F0EB" stroke="#16120D" stroke-width="1.6"/><text x="210" y="150" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="11" letter-spacing="0.6" fill="#E85D04" text-anchor="start" font-weight="600">375-400F</text><text x="210" y="166" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="11" letter-spacing="0.6" fill="#16120D" text-anchor="start" font-weight="400">12-18 MIN</text><text x="210" y="182" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="10" letter-spacing="0.6" fill="#8A8078" text-anchor="start" font-weight="400">LEAST OIL</text><rect x="380" y="30" width="140" height="100" fill="#fff" stroke="#16120D" stroke-width="2"/><text x="450" y="52" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="12" letter-spacing="0.6" fill="#16120D" text-anchor="middle" font-weight="600">OVEN</text><text x="450" y="68" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="9" letter-spacing="0.6" fill="#8A8078" text-anchor="middle" font-weight="400">RADIANT + AIR</text><line x1="410" y1="84" x2="410" y2="94" stroke="#E85D04" stroke-width="2"/><line x1="430" y1="84" x2="430" y2="94" stroke="#E85D04" stroke-width="2"/><line x1="450" y1="84" x2="450" y2="94" stroke="#E85D04" stroke-width="2"/><line x1="470" y1="84" x2="470" y2="94" stroke="#E85D04" stroke-width="2"/><line x1="490" y1="84" x2="490" y2="94" stroke="#E85D04" stroke-width="2"/><rect x="426" y="100" width="48" height="14" fill="#F2F0EB" stroke="#16120D" stroke-width="1.6"/><text x="380" y="150" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="11" letter-spacing="0.6" fill="#E85D04" text-anchor="start" font-weight="600">400-425F</text><text x="380" y="166" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="11" letter-