<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" role="img" aria-label="Cross-section of a tofu block pressed under a weighted plate"><title>Cross-section of a tofu block pressed under a weighted plate</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E85D04"/></marker></defs><rect x="70" y="40" width="300" height="26" fill="#fff" stroke="#16120D" stroke-width="2"/><text x="384" y="57" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="11" letter-spacing="0.6" fill="#16120D" text-anchor="start" font-weight="400">WEIGHT 2-4 LB</text><rect x="90" y="74" width="260" height="12" fill="#F2F0EB" stroke="#16120D" stroke-width="2"/><text x="384" y="85" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="11" letter-spacing="0.6" fill="#8A8078" text-anchor="start" font-weight="400">FLAT PLATE</text><rect x="96" y="90" width="248" height="10" fill="none" stroke="#8A8078" stroke-width="2" stroke-dasharray="5 4"/><text x="384" y="100" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="11" letter-spacing="0.6" fill="#8A8078" text-anchor="start" font-weight="400">TOWEL</text><rect x="96" y="102" width="248" height="58" fill="#fff" stroke="#16120D" stroke-width="2"/><text x="220" y="137" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="13" letter-spacing="0.6" fill="#16120D" text-anchor="middle" font-weight="600">TOFU BLOCK</text><rect x="96" y="90" width="248" height="10" fill="none" stroke="#8A8078" stroke-width="2" stroke-dasharray="5 4"/><rect x="70" y="164" width="300" height="14" fill="#F2F0EB" stroke="#16120D" stroke-width="2"/><text x="384" y="176" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="11" letter-spacing="0.6" fill="#8A8078" text-anchor="start" font-weight="400">RIMMED PAN</text><path d="M130,162 q4,8 0,12 q-4,-4 0,-12z" fill="#E85D04"/><path d="M180,1