<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" role="img" aria-label="Cut sizes for tofu and what each is used for"><title>Cut sizes for tofu and what each is used for</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E85D04"/></marker></defs><text x="40" y="30" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="11" letter-spacing="0.6" fill="#16120D" text-anchor="start" font-weight="600">CUBE</text><text x="40" y="46" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="10" letter-spacing="0.6" fill="#E85D04" text-anchor="start" font-weight="600">3/4 IN</text><rect x="40" y="60" width="46" height="46" fill="#fff" stroke="#16120D" stroke-width="2"/><text x="40" y="128" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="10" letter-spacing="0.6" fill="#8A8078" text-anchor="start" font-weight="400">STIR FRY, BOWLS</text><text x="185" y="30" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="11" letter-spacing="0.6" fill="#16120D" text-anchor="start" font-weight="600">SLAB</text><text x="185" y="46" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="10" letter-spacing="0.6" fill="#E85D04" text-anchor="start" font-weight="600">1/2 IN</text><rect x="185" y="68" width="78" height="30" fill="#fff" stroke="#16120D" stroke-width="2"/><text x="185" y="128" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="10" letter-spacing="0.6" fill="#8A8078" text-anchor="start" font-weight="400">KATSU, GRILL</text><text x="330" y="30" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="11" letter-spacing="0.6" fill="#16120D" text-anchor="start" font-weight="600">TRIANGLE</text><text x="330" y="46" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="10" letter-spacing="0.6" fill="#E85D04" text-anchor="start" font-weight="600">1/2 IN</text><path d="M330,106 L382,106 L356,60 z" fill="#fff" stroke="#16120D" stroke-width="2"/><text x="330" y="128" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="10" letter-spacing="0.6" fill="#8A8078" text-anchor="start" font-weight="400">MORE EDGES</text><text x="455" y="30" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="11" letter-spacing="0.6" fill="#16120D" text-anchor="start" font-weight="600">TORN</text><text x="455" y="46" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="10" letter-spacing="0.6" fill="#E85D04" text-anchor="start" font-weight="600">IRREG.</text><path d="M455,80 q10,-22 26,-14 q18,-10 28,8 q10,16 -6,26 q-14,14 -30,4 q-18,-4 -18,-24z" fill="#fff" stroke="#16120D" stroke-width="2"/><text x="455" y="128" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="10" letter-spacing="0.6" fill="#8A8078" text-anchor="start" font-weight="400">FROZEN TOFU</text><line x1="40" y1="150" x2="520" y2="150" stroke="#D8D3CA" stroke-width="1"/><text x="40" y="174" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="11" letter-spacing="0.6" fill="#16120D" text-anchor="start" font-weight="400">SMALLER PIECES DRY THROUGH BEFORE THE OUTSIDE BROWNS. KEEP SIZES EVEN.</text><text x="40" y="192" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="11" letter-spacing="0.6" fill="#E85D04" text-anchor="start" font-weight="600">MIXED SIZES IN ONE PAN = SOME BURNT, SOME PALE</text></svg>